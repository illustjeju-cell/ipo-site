name: 공모주 수집·배포
on:
  schedule:
    - cron: "23 1,5,9,13 * * *"   # 하루 4회 (UTC) ≈ KST 10:23·14:23·18:23·22:23
  repository_dispatch:
    types: [update]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 수집
        env: { OPENDART_KEY: "${{ secrets.IPO }}" }
        run: python scripts/collect.py
      - name: 데이터 커밋
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/ipos.json; git diff --cached --quiet || (git commit -m "data: $(date -u +%F' '%H:%M)" && git push)
      - name: 빌드
        env:
          SITE_URL: https://ipo.acoustic42.com
          ADSENSE_CLIENT: ca-pub-6296151372908822
          CNAME: ipo.acoustic42.com
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
